name: daily-publish
on:
  schedule:
    - cron: "0 9 * * *"     # 18:00 JST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2 fonts-dejavu-core
      - uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - run: pip install -r requirements.txt
      - name: Write today's episode with AI (if nothing is scheduled)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$(python publish.py next)" ]; then
            python engine/write_story.py
            git config user.name "rlb-bot"; git config user.email "rlb-bot@users.noreply.github.com"
            git add episodes queue.json && git commit -m "AI episode $(date +%F)" && git push
          fi
      - name: Find due episode
        id: due
        run: echo "ep=$(python publish.py next)" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.due.outputs.ep != ''
        run: bash build.sh "${{ steps.due.outputs.ep }}"
      - name: Upload to YouTube
        if: steps.due.outputs.ep != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_PRIVACY: ${{ vars.PUBLISH_PRIVACY }}
        run: python publish.py upload
      - name: Save build for review
        if: steps.due.outputs.ep != ''
        uses: actions/upload-artifact@v4
        with: { name: "${{ steps.due.outputs.ep }}", path: "work/${{ steps.due.outputs.ep }}/out/*.mp4", retention-days: 7 }
      - name: Record video IDs
        if: steps.due.outputs.ep != ''
        run: |
          git config user.name "rlb-bot"; git config user.email "rlb-bot@users.noreply.github.com"
          git add queue.json && git commit -m "published ${{ steps.due.outputs.ep }}" && git push || true
