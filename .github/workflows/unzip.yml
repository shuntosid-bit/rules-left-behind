name: unpack-upload
on:
  push:
    paths: ["rules-left-behind-repo.zip", ".github/workflows/unzip.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root (workflow files are added separately)
        run: |
          [ -f rules-left-behind-repo.zip ] || exit 0
          unzip -q rules-left-behind-repo.zip -d /tmp/x
          rsync -a --exclude '.github' /tmp/x/rules-left-behind/ ./
          git rm -q rules-left-behind-repo.zip
          git config user.name "rlb-bot"; git config user.email "rlb-bot@users.noreply.github.com"
          git add -A && git commit -m "Unpack project files" && git push
